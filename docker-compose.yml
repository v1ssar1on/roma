services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - '1337:3000'

  frontend:
    build:
      context: ./frontend
      args:
        # the client's fallback in src/api/socket.ts assumes backend on port 3000 of the
        # same host, which no longer holds now that backend is published on 1337 - so this
        # has to be set explicitly. override with your real domain for an actual prod deploy
        VITE_WS_URL: ${VITE_WS_URL:-http://localhost:1337}
    restart: unless-stopped
    ports:
      - '7331:80'
    depends_on:
      - backend
