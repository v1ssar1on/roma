services:
  backend:
    build: ./backend
    restart: unless-stopped
    expose:
      - '1337'

  frontend:
    build:
      context: ./frontend
      args:
        # baked in at build time - point it at the public URL Dokploy assigns
        # the backend service (its Domain, e.g. https://ws.yourdomain.com)
        VITE_WS_URL: ${VITE_WS_URL}
    restart: unless-stopped
    expose:
      - '7331'
    depends_on:
      - backend
